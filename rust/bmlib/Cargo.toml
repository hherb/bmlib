[package]
name = "bmlib"
description = "Shared library for biomedical literature tools — Rust port of the Python bmlib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# Rendered on the crates.io page. The crate ships its own copy rather than
# pointing at `rust/README.md`, which is 400 lines of build instructions for a
# contributor and not what a consumer of the published crate needs.
readme = "README.md"
keywords = ["biomedical", "literature", "pubmed", "llm", "jats"]
categories = ["science", "text-processing", "parsing"]
# `publish = false` stood here until the crate was prepared for crates.io. It is
# gone rather than set to `true`: absence is what "publishable" means, and
# `publish = true` is accepted in silence — measured, `cargo package` warns on
# neither spelling — so writing it would add a key that carries no information.

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
csv = "1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
# SHA-1, for `sanitize_identifier`'s collision guarantee. Its own crate and not
# a hand-rolled hash: the digest is what stops two different identifiers sharing
# one cache file, so a subtly wrong implementation fails *silently* by collision.
# (`libsqlite3-sys` bundles a SHA-1 in C, but does not generate a binding for it,
# so reaching it would mean declaring the symbol by hand.)
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NFKD, for the PDF-title check. A **dependency and not a hand-rolled table**:
# the fold from a precomposed character to its base plus marks covers ~1,900
# characters, which is not the "small" the port's policy reserves for hand-rolling,
# and a partial table fails silently — it makes two spellings of one title
# compare unequal, so a good title is dropped with only a DEBUG line.
unicode-normalization = "0.1"
# The section-heading pattern table. Rust has no regex in std, and these are
# anchored alternations with word boundaries — a hand-rolled scanner gets
# case-insensitive matching and `\b` wrong.
regex = "1"
# The quality extractors' rule tables, which use lookaround and scoped case
# folding. **The port plan's §2 allows this crate for exactly these sites and
# refuses it elsewhere**: it adds backtracking, so it is kept off adversarial
# input in a hot loop, and `quality/extractors.rs` reads an abstract or a full
# text from a database rather than a stream under an attacker's control. Python
# runs the same patterns on the same bytes through `re`, which is also a
# backtracking engine, so this is fidelity-preserving rather than a new worst
# case; the possessive quantifiers Python uses as backtracking guards are
# transcribed as atomic groups.
fancy-regex = "0.18"
# A real HTTP client, behind `HttpClient`. **The trait had no production
# implementation until this**: every fetcher, the LLM transport and the
# transparency analyzer could only run against a test fake, so the library
# compiled and its tests passed while nothing could actually fetch a URL.
# `ureq` is blocking and small, which matches the fetchers' shape — they are a
# request-per-page walk, not a concurrent fan-out — so no async runtime is
# dragged in for a loop that never awaits two things at once.
ureq = { version = "3", optional = true }
# The PDF text backend. **The closest equivalent to PyMuPDF**, which the source
# uses: both expose the per-character bounding box and the span font attributes
# that `pdf_text::line_to_block` needs to pick the dominant span. `lopdf` is pure
# Rust but gives no font information, so a heading numbered in a different weight
# would lose its styling and `segmenter`'s heading tests would read the wrong size
# — the reason `pdf_text.rs` exists at all.
#
# PDFium is a C++ library, so this is the port's one non-Rust dependency and the
# plan's §5 prices it as such. `pdfium-bundled` fetches a prebuilt binary at build
# time rather than requiring a system install; the feature is optional so a caller
# who never converts a PDF does not pay for it.
pdfium-render = { version = "0.9", optional = true }
pdfium-bundled = { version = "0.2", optional = true, features = ["bundled"] }
# HTML to canonical text (`fulltext::canonical::html`). html5ever, the WHATWG
# parser Python reaches through markupever, so a page builds one tree in both
# languages. `scraper` is the maintained tree over it (its CSS-selector half goes
# unused); 0.27 rather than 0.29, released 2026-10-21 and too new to take, which
# leaves html5ever at 0.39 here and 0.40 in markupever. `ego-tree` is scraper's
# tree, named for its `Edge`, which every walk is iterative over.
scraper = { version = "0.27", optional = true, default-features = false }
ego-tree = { version = "0.11", optional = true }
# The PostgreSQL backend: a real driver behind the `postgres` feature, matching
# the Python library's optional `psycopg2` extra. Optional so a caller that only
# ever opens SQLite does not link a Postgres client and its async runtime. The
# `postgres` crate is the *blocking* wrapper over `tokio-postgres`: it drives the
# connection task on its own runtime thread, which is what lets the sync `Db`
# trait stay sync — the same reason `ureq` was chosen over an async HTTP client.
postgres = { version = "0.19", optional = true }
# `ToSql`'s signature names `bytes::BytesMut`, so a hand-written implementation
# for [`Value`] must name it too. Pulled in only with the backend.
bytes = { version = "1", optional = true }
# The embedder's inference engine (llama.cpp). **Pinned exactly**: the GGUF
# files were converted, and the cosine floors measured, with one llama.cpp
# commit; a crate bump moves that commit, and with it the inference numerics
# (and possibly whether the files load). It compiles llama.cpp from source, so
# it needs cmake and a C++ compiler.
llama-cpp-2 = { version = "=0.1.159", optional = true }
# Pinned to the same version as `llama-cpp-2`, which would otherwise accept a
# newer -sys crate: 0.1.159 vendors llama.cpp 26394b4e6749a41c3633db040e0987500a5f7013,
# the commit the GGUF files were converted with; 0.1.160 vendors a different one.
llama-cpp-sys-2 = { version = "=0.1.159", optional = true }
# SHA-256, for the model download's checksum. Its own crate: a wrong digest
# would fail *silently* by accepting a corrupt multi-gigabyte file.
sha2 = { version = "0.10", optional = true }

[features]
# `sqlite` and `http-ureq` are on by default, so a consumer depending on bmlib
# with its default features builds exactly what it built before. A consumer
# that already wrote `default-features = false` loses both — a no-op while
# `default = []`, a change now. The mobile build (rust/bmlib-ffi, which depends
# on bmlib with `default-features = false`) turns both off: the apps own their
# storage and their transport, so the bundled SQLite C build and rustls/ring are
# not compiled at all. CI builds and tests that configuration (`-p bmlib
# --no-default-features`, `-p bmlib-ffi`), which a workspace-wide build cannot
# see — resolver 2 unifies bmlib's defaults back in for every member.
default = ["sqlite", "http-ureq"]
# The SQLite backend (`db::sqlite`, `db::open_memory`, `db::open_path`), over
# rusqlite with SQLite bundled.
sqlite = ["dep:rusqlite"]
# The real `HttpClient` over `ureq` (`bmlib::http`).
http-ureq = ["dep:ureq"]
# PDF text extraction. Off by default, so a build that never reads a PDF needs no
# C++ toolchain and no download.
pdf = ["dep:pdfium-render", "dep:pdfium-bundled"]
# HTML to canonical text. Off by default, as Python's `html` extra is, so a build
# that never reads a web page does not compile an HTML parser.
html = ["dep:scraper", "dep:ego-tree"]
# The PostgreSQL backend. Off by default. `Dialect::Postgres`, the placeholder
# rewriter and the PostgreSQL DDL are always present; this adds the driver that
# can actually run a statement against a server.
postgres = ["dep:postgres", "dep:bytes"]
# The in-process embedder: `bmlib::embed`'s model verification and `Embedder`.
# Off by default, so a build that never embeds needs no C++ toolchain. The
# constants and vector rules in `bmlib::embed` are always present; the download
# additionally needs `http-ureq`.
embed = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:sha2"]
# `embed` with llama.cpp's Metal backend named explicitly. On macOS `embed`
# already uses Metal (llama.cpp's default); a CPU-only build needs
# `GGML_METAL=OFF` in the environment.
embed-metal = ["embed", "llama-cpp-2/metal"]

[lints]
workspace = true

# The integration tests that need a default feature. Each one using
# `tests/common` needs `sqlite` because the shared helpers open an in-memory
# database. Listed so `cargo test -p bmlib --no-default-features` builds and
# runs the rest rather than failing to compile; every other test is still
# discovered automatically.

[[test]]
name = "biorxiv"
required-features = ["sqlite"]

[[test]]
name = "db_oracle"
required-features = ["sqlite"]

[[test]]
name = "dialect"
required-features = ["sqlite"]

[[test]]
name = "fetchers"
required-features = ["sqlite"]

[[test]]
name = "http"
required-features = ["http-ureq"]

[[test]]
name = "live_network"
required-features = ["http-ureq"]

[[test]]
name = "live_sync"
required-features = ["sqlite", "http-ureq"]

[[test]]
name = "migrations"
required-features = ["sqlite"]

[[test]]
name = "openalex"
required-features = ["sqlite"]

[[test]]
name = "operations"
required-features = ["sqlite"]

[[test]]
name = "oracle_response"
required-features = ["sqlite"]

[[test]]
name = "publication_schema"
required-features = ["sqlite"]

[[test]]
name = "publication_storage"
required-features = ["sqlite"]

[[test]]
name = "pubmed_fetcher"
required-features = ["sqlite"]

[[test]]
name = "pubmed_partitioned"
required-features = ["sqlite"]

[[test]]
name = "retraction_store"
required-features = ["sqlite"]

[[test]]
name = "sync_source"
required-features = ["sqlite"]

[[test]]
name = "transactions"
required-features = ["sqlite"]

# The oracle tests parse Python's floats and compare them with `==`. serde_json's
# default float parse can be one ulp off the correctly rounded value (it parsed
# 0.9888888888888889 as ...88), which reads as a port mismatch that is not
# one; `float_roundtrip` makes the parse exact. Test builds only.
[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
