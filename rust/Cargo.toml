[workspace]
resolver = "2"
members = ["bmlib", "bmlib-ffi"]

[workspace.package]
# One literal for the workspace; every member published from here is the same
# project. See `bmlib/CHANGELOG.md` for what moved between versions — 0.2.0 is the
# first release after 0.1.0, carrying both the quality-reader fixes and three changed
# public signatures in `fulltext::cache`. 0.1.1 was prepared and never published; its
# entries were folded into 0.2.0.
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
# crates.io shows this under the crate title and links the version it built to
# the exact commit. One literal for the workspace, since every member published
# from here is the same project.
repository = "https://github.com/hherb/bmlib"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# The FFI build that ships inside the mobile apps (rust/bmlib-ffi). Its own
# profile so `cargo build --release` for the library and its tests is unchanged.
# `panic` stays `unwind`: UniFFI catches a Rust panic at the boundary and, for a
# function returning `Result`, turns it into a foreign exception, which `abort`
# would replace with a crash. (Swift calls a non-throwing function with `try!`,
# so a panic there traps either way.)
[profile.release-ffi]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
