name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run to catch breakage from unpinned upstream dependencies
    # (all extras use `>=` version ranges).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main builds; superseded PR pushes are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned so a ruff release with new formatting rules can't fail CI
        # on files a PR never touched. Bump deliberately (and reformat in
        # the same commit) with: pip install ruff==<new> && ruff format .
        run: python -m pip install ruff==0.15.20
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  types:
    name: Types (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # bmlib ships `py.typed`, so the annotations are a promise to every
        # downstream on any supported interpreter. mypy sets no
        # `python_version`, which means it checks against whichever one runs
        # it — so this matrix is what makes the promise hold across the range
        # `requires-python` advertises, rather than on one version.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with all extras
        # `[all,dev]`, not mypy alone: every extra but psycopg2 ships its own
        # `py.typed` (and `types-psycopg2`, in `dev`, covers that one), so
        # mypy resolves real types only in an environment that actually has
        # them. Run against a bare interpreter it reports the optional
        # imports — and `jinja2`, a *core* dependency — as missing stubs,
        # which is noise that hides the findings underneath.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      # Version and settings both live in pyproject.toml, so this is the same
      # command a developer runs locally. mypy is pinned there for the reason
      # ruff is pinned above.
      - name: mypy
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # tests/test_backends.py runs every case against both backends. Without a
      # server the PostgreSQL half skips, so the dual-backend guarantee would
      # rest entirely on someone remembering to test by hand.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmlib
          POSTGRES_PASSWORD: bmlib
          POSTGRES_DB: bmlib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BMLIB_TEST_POSTGRESQL_DSN: "host=localhost port=5432 dbname=bmlib_test user=bmlib password=bmlib"
      # Turn a skip into a failure: a broken DSN would otherwise leave the
      # PostgreSQL half silently unrun and CI green.
      BMLIB_REQUIRE_POSTGRESQL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=bmlib --cov-report=term-missing:skip-covered

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import bmlib; print(bmlib.__version__)"

  rust-lint:
    name: Rust lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Add clippy and rustfmt
        # Components of the toolchain rather than separate tools; the runner
        # image does not promise either.
        run: rustup component add clippy rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # The lock file is committed, so this is a build cache and never a
          # source of drift.
          key: ${{ runner.os }}-rust-lint-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-lint-
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (postgres feature)
        # The default feature set does not compile `db/postgres.rs` at all, so
        # a warning there would otherwise reach main unseen.
        run: cargo clippy --all-targets --features postgres -- -D warnings
      - name: rustdoc (intra-doc links)
        # `clippy` does not read doc comments, so a link to a renamed item, a
        # private one or a bracket in prose that reads as a link survives every
        # other gate. Round 55 found **eighteen** — among them three doc lines
        # naming `RepairError` variants that do not exist — and fixed them; this
        # is what keeps the count there.
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-test:
    name: Rust test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            args: ""
          - label: pdf
            args: "--features pdf"
    defaults:
      run:
        working-directory: rust
    env:
      # `pdfium-bundled` fetches a prebuilt library at build time. Pointing it
      # inside the workspace makes what the cache below holds unambiguous.
      PDFIUM_BUNDLED_CACHE_DIR: ${{ github.workspace }}/rust/.pdfium-cache
    steps:
      - uses: actions/checkout@v7
      - name: Install PDFium's runtime libraries
        # PDFium ships as a shared library whose own dependencies include the
        # font and image stack. The runner image happens to carry most of it;
        # naming them turns "liblcms2.so.2: cannot open shared object file"
        # from a red test run into a package install.
        if: matrix.label == 'pdf'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libfreetype6 liblcms2-2 libopenjp2-7 libpng16-16
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/.pdfium-cache
          key: ${{ runner.os }}-rust-${{ matrix.label }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ matrix.label }}-
      - name: Test
        run: cargo test ${{ matrix.args }}

  rust-postgres:
    name: Rust PostgreSQL (live server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    services:
      postgres:
        # The same image the Python dual-backend tests use. The Rust suite
        # creates and drops a database per test, so it needs the service's
        # superuser rather than the pre-created `bmlib` role.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The suite is gated on this; without it its ten tests return
      # immediately and the job would pass having proved nothing.
      BMLIB_PG_TESTS: "1"
      BMLIB_PG_HOST: localhost
      BMLIB_PG_PORT: "5432"
      BMLIB_PG_USER: postgres
      BMLIB_PG_PASSWORD: postgres
      BMLIB_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-rust-postgres-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-postgres-
      - name: The whole suite, with the backend compiled in
        # One command, not two: `BMLIB_PG_TESTS` is set for the job, so the
        # gated suite runs under this one too. A dialect failure and a build
        # failure are told apart by the failing test's name.
        run: cargo test --features postgres

  ci-success:
    name: CI success
    # Aggregate gate: point branch protection at this single check so the job
    # list can change without touching repository settings. It fails on
    # `skipped` as well as on `failure`, which is why no job above carries a
    # `paths` filter — a filtered-out job would block every unrelated PR.
    if: always()
    needs: [lint, types, test, build, rust-lint, rust-test, rust-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every dependency job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
