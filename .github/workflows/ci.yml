name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run to catch breakage from unpinned upstream dependencies
    # (all extras use `>=` version ranges).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main builds; superseded PR pushes are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned so a ruff release with new formatting rules can't fail CI
        # on files a PR never touched. Bump deliberately (and reformat in
        # the same commit) with: pip install ruff==<new> && ruff format .
        run: python -m pip install ruff==0.15.20
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # tests/test_backends.py runs every case against both backends. Without a
      # server the PostgreSQL half skips, so the dual-backend guarantee would
      # rest entirely on someone remembering to test by hand.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmlib
          POSTGRES_PASSWORD: bmlib
          POSTGRES_DB: bmlib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BMLIB_TEST_POSTGRESQL_DSN: "host=localhost port=5432 dbname=bmlib_test user=bmlib password=bmlib"
      # Turn a skip into a failure: a broken DSN would otherwise leave the
      # PostgreSQL half silently unrun and CI green.
      BMLIB_REQUIRE_POSTGRESQL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=bmlib --cov-report=term-missing:skip-covered

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import bmlib; print(bmlib.__version__)"

  ci-success:
    name: CI success
    # Aggregate gate: point branch protection at this single check so the
    # test matrix can change without touching repository settings.
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every dependency job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
