[build-system]
# >=77 is required for PEP 639: the SPDX `license` string and `license-files`
# below are silently mishandled by older setuptools.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bmlib"
version = "0.10.0"
description = "Shared library for biomedical literature tools — LLM abstraction, quality assessment, transparency analysis, and database utilities"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Horst Herb", email = "my.list.subscriptions@gmail.com" },
]
keywords = [
    "biomedical",
    "llm",
    "quality-assessment",
    "literature",
    "systematic-review",
    "pubmed",
    "evidence-based-medicine",
]
# No "License ::" classifier: PEP 639 supersedes it with the SPDX `license`
# field above, and setuptools rejects declaring both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/hherb/bmlib"
Repository = "https://github.com/hherb/bmlib"
Documentation = "https://github.com/hherb/bmlib/blob/main/docs/manual/index.md"
Changelog = "https://github.com/hherb/bmlib/blob/main/CHANGELOG.md"
Issues = "https://github.com/hherb/bmlib/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.3"]
openai = ["openai>=1.0"]
postgresql = ["psycopg2-binary>=2.9"]
transparency = ["httpx>=0.25"]
publications = ["httpx>=0.25"]
# `fulltext` supplies httpx only. PDF→text extraction stays behind `pdf`,
# which is separately useful and would otherwise drag a ~20 MB binary wheel
# onto anyone who only wants JATS retrieval.
fulltext = ["httpx>=0.25"]
# Floor at 1.28.2 (current at the time of writing) so `import pymupdf` is
# both available and typed. The type reason alone justifies only 1.27.1 —
# the release that added `py.typed` — with the module name itself arriving
# in 1.24.3; that is the number to dial back to if a downstream needs an
# older PyMuPDF. Below 1.27.1 the import costs a permanent
# `# type: ignore[import-untyped]` that switches off checking for the whole
# of `pdf_converter.py`.
pdf = ["pymupdf>=1.28.2"]
# mypy is pinned for the same reason ruff is (see .github/workflows/ci.yml):
# a release with new checks would otherwise fail CI on files a PR never
# touched. `psycopg2` is the one extra shipping no `py.typed`, so
# `types-psycopg2` supplies the only stubs bmlib needs from typeshed; every
# other extra carries its own marker, which is why mypy must run in an
# environment that actually has the extras installed.
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy==2.3.0", "types-psycopg2"]
# `all` deliberately excludes `dev`: it is what a consumer installs to get
# every runtime feature, and it should not drag pytest and ruff into their
# environment. For a full development install use `.[all,dev]`.
all = ["bmlib[anthropic,ollama,openai,postgresql,transparency,publications,fulltext,pdf]"]

# Explicit discovery. Auto-discovery works today but is order-dependent in a
# flat layout with tests/, docs/ and scripts/ beside the package; naming the
# package keeps a stray top-level directory from being picked up or the build
# from failing outright.
[tool.setuptools.packages.find]
include = ["bmlib*"]

# Ship the PEP 561 marker so type checkers in consuming projects actually use
# bmlib's annotations instead of treating the package as untyped.
[tool.setuptools.package-data]
bmlib = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# xml.sax ContentHandler requires camelCase override method names.
"bmlib/fulltext/jats_parser.py" = ["N802"]
# The `StubProvider` pytest fixture returns a class, so PascalCase is intentional.
"tests/test_openai_compat.py" = ["N802", "N803"]

# bmlib ships `py.typed` (see [tool.setuptools.package-data] above), which
# tells every downstream that these annotations are meant to be relied on.
# This is what checks that claim. Scope is the shipped package only — the
# promise is about what is installed, not about `tests/` or `scripts/`.
#
# No `python_version`: mypy then checks against whichever interpreter runs
# it, which is what makes CI's 3.11/3.12/3.13 matrix mean something.
[tool.mypy]
files = ["bmlib"]
# An unannotated function is skipped in silence at mypy's defaults, so
# without this the gate would pass a file carrying no annotations at all —
# exactly the hole `py.typed` denies.
disallow_untyped_defs = true
# Keeps every `# type: ignore` honest: one that stops suppressing anything
# is reported rather than left behind as decoration.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# No per-module `ignore_missing_imports` overrides. The one untyped import
# bmlib has (`fitz`) carries an inline `# type: ignore[import-untyped]`
# instead: `warn_unused_ignores` reports that the day PyMuPDF ships a
# `py.typed`, whereas a stale override here would go on suppressing
# nothing, silently.

[tool.pytest.ini_options]
testpaths = ["tests"]
